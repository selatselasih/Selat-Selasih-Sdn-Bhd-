<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selat Selasih Sdn Bhd — Delivery Transactions</title>
<link rel="stylesheet" href="style.css?v=4">
<style>
  /* Reliable truncation for table cells (company / notes) regardless
     of the table's layout mode. A nested block element respects
     overflow + text-overflow even when the <td> itself doesn't. */
  .cell-trunc{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* Rows in list tables that open a detail popup when tapped. */
  tr.row-tappable{cursor:pointer;}
  tr.row-tappable:hover td{background:var(--paper-2);}

  /* Detail popup: label/value pairs */
  .detail-row{
    display:flex;justify-content:space-between;gap:16px;
    padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;
  }
  .detail-row:last-of-type{border-bottom:none;}
  .detail-row .k{color:var(--brass-dark);font-weight:600;flex-shrink:0;}
  .detail-row .v{text-align:right;word-break:break-word;flex:1;min-width:0;}
  .detail-row .v.tappable{
    color:var(--forest);text-decoration:underline;cursor:pointer;
  }
  .detail-note{
    margin-top:10px;padding:12px;background:var(--paper-2);
    border-radius:4px;font-size:13px;line-height:1.55;white-space:pre-wrap;
  }

  /* Condo unit sections */
  .condo-unit{
    background:var(--white);border:1px solid var(--line);border-radius:6px;
    padding:18px 20px;margin-bottom:18px;
  }
  .condo-unit-head{
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;flex-wrap:wrap;margin-bottom:14px;
    padding-bottom:12px;border-bottom:2px solid var(--ink);
  }
  .condo-unit-name{font-family:'Fraunces',serif;font-weight:600;font-size:19px;}
  .condo-unit-stats{display:flex;gap:18px;font-size:12.5px;color:#5c5e56;flex-wrap:wrap;}
  .condo-unit-stats b{font-family:'IBM Plex Mono',monospace;color:var(--ink);display:block;}
  .condo-sub-head{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin:16px 0 8px;flex-wrap:wrap;
  }
  .condo-sub-title{
    font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--brass-dark);font-weight:600;
  }
  .btn-sm{
    background:transparent;border:1.5px solid var(--ink);border-radius:4px;
    padding:6px 12px;font-family:'Inter',sans-serif;font-size:12px;
    font-weight:600;cursor:pointer;color:var(--ink);
  }
  .btn-sm:hover{background:var(--line);}

  /* Paid / unpaid status pills */
  .pill{
    display:inline-block;padding:3px 9px;border-radius:20px;
    font-size:11px;font-weight:600;white-space:nowrap;
  }
  .pill-paid{background:#E3EFE6;color:var(--forest);}
  .pill-unpaid{background:#F7E4E0;color:var(--rust);}
  .pill-partial{background:#F6ECD9;color:var(--brass-dark);}
</style>
</head>

<script>
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SETTINGS_PASSWORD = "Selat*1985"; // <-- change this to whatever password you want
let settings = {
  company:"Selat Selasih Sdn Bhd", regNo:"1180708-X", address:"No.6, Jalan Sentosa 30, Jalan Meru, 41050 Klang, Selangor Darul Ehsan.", currency:"RM", rate:72,
  invoicePrefix:"PR", description:"Sale of Prawns", bankName:"", bankAcc:"", googleSheetUrl:""
};
let deliveries = [];
let lastEntry = null;
let customers = [];
let currentYear = new Date().getFullYear();

function fmtMoney(n){ return Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtMoneyC(n){ return settings.currency + " " + fmtMoney(n); }
function fmtKg(n){ return Number(n).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:2}) + " kg"; }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function ddmmyy(dateStr){ const [y,m,d]=dateStr.split('-'); return d+m+y.slice(2); }
function displayDate(dateStr){ const [y,m,d]=dateStr.split('-'); return `${d}.${m}.${y}`; }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }

const FIREBASE_DB_URL = "https://selat-selasih-sdn-bhd-default-rtdb.asia-southeast1.firebasedatabase.app/";

async function fbGet(path){
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ console.error('Firebase read failed', e); return null; }
}
async function fbSet(path, value){
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value)
    });
    return res.ok;
  }catch(e){ console.error('Firebase write failed', e); return false; }
}

async function loadData(){
  try{
    const s = await fbGet('settings');
    if(s){ settings = Object.assign({}, settings, s); }
  }catch(e){}
  try{
    const d = await fbGet('deliveries');
    if(d){ deliveries = d; }
  }catch(e){ deliveries = []; }
  try{
    const c = await fbGet('customers');
    if(c){ customers = c; }
  }catch(e){ customers = []; }
  try{
    const sp = await fbGet('supplierPayments');
    if(sp){ supplierPayments = sp; }
  }catch(e){ supplierPayments = []; }
  try{
    const cu = await fbGet('condoUnits');
    if(cu && cu.length){ condoUnits = cu; }
  }catch(e){}
  try{
    const cr = await fbGet('condoRent');
    if(cr){ condoRent = cr; }
  }catch(e){ condoRent = []; }
  try{
    const ce = await fbGet('condoExpenses');
    if(ce){ condoExpenses = ce; }
  }catch(e){ condoExpenses = []; }
  try{
    const cer = await fbGet('condoExpectedRent');
    if(cer){ condoExpectedRent = cer; }
  }catch(e){ condoExpectedRent = {}; }
  try{
    const ct = await fbGet('condoTenants');
    if(ct){ condoTenants = ct; }
  }catch(e){ condoTenants = {}; }
}
async function saveSettings(){ await fbSet('settings', settings); }
async function saveDeliveries(){ await fbSet('deliveries', deliveries); }
async function saveCustomers(){ await fbSet('customers', customers); }

function refreshRateUI(){
  document.getElementById('rate-display').textContent = fmtMoneyC(settings.rate);
  updateAmount();
}
function updateAmount(){
  const kg = parseFloat(document.getElementById('kg-input').value) || 0;
  const amt = kg * settings.rate;
  document.getElementById('amount-display').textContent = fmtMoneyC(amt);
}

function refreshCustomerList(){
  const dl = document.getElementById('customer-list');
  dl.innerHTML = customers.map(c => `<option value="${escapeHtml(c.name)}">`).join('');
}

function nextInvoiceNo(dateStr){
  const base = settings.invoicePrefix + ddmmyy(dateStr);
  const sameDay = deliveries.filter(d => d.date === dateStr).length;
  return sameDay === 0 ? base : base + '-' + (sameDay + 1);
}

function renderSlip(entry){
  lastEntry = entry;
  const card = document.getElementById('slip-card');
  const payable = entry.amount - (entry.deposit || 0);
  const addrLines = (entry.address || '').split('\n').filter(Boolean).map(l => escapeHtml(l)).join('<br>');
  const coAddrLines = (settings.address || '').split('\n').filter(Boolean).map(l => escapeHtml(l)).join(', ');
  card.innerHTML = `
    <div class="inv-co-name">${escapeHtml(settings.company)} ${settings.regNo ? `<span class="regno">(${escapeHtml(settings.regNo.replace(/^\(+|\)+$/g,''))})</span>` : ''}</div>
    ${settings.address ? `<div class="inv-co-address">${coAddrLines}</div>` : ''}

    <div class="inv-meta-row">
      <div class="inv-billto">
        <div class="lbl"> <br> Bill To :
          </div>
        <div class="name">${entry.party ? escapeHtml(entry.party) : '—'}</div>
        ${addrLines ? `<div>${addrLines}</div>` : ''}
      </div>
      <div class="inv-title">
        <h3>Invoice</h3>
        <table class="inv-meta-table" style="margin-left:auto;">
          <tr><td class="k">Invoice No</td><td class="sep">:</td><td>${entry.invoiceNo}</td></tr>
          <tr><td class="k">Invoice Date</td><td class="sep">:</td><td>${displayDate(entry.date)}</td></tr>
          <tr><td class="k">Terms</td><td class="sep">:</td><td>-</td></tr>
          <tr><td class="k">Due Date</td><td class="sep">:</td><td>-</td></tr>
          <tr><td class="k">Reference</td><td class="sep">:</td><td>-</td></tr>
        </table>
      </div>
    </div>

    <table class="inv-items">
      <thead>
        <tr>
          <th style="width:32px;">No</th>
          <th>Description</th>
          <th class="r">Unit Price<br>Amt (${escapeHtml(settings.currency)})</th>
          <th class="r">Amount<br>(${escapeHtml(settings.currency)})</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>${escapeHtml(entry.description || settings.description)}<div class="sub">Weight : ${fmtKg(entry.kg)}</div></td>
          <td class="r">${escapeHtml(settings.currency)}${fmtMoney(entry.rate)} / kg</td>
          <td class="r">${fmtMoney(entry.amount)}</td>

async function upsertCustomer(name, address){
  if(!name) return;
  const existing = customers.find(c => c.name.toLowerCase() === name.toLowerCase());
  if(existing){
    if(address && address !== existing.address){ existing.address = address; }
  }else{
    customers.push({ name, address: address || '' });
  }
  await saveCustomers();
  refreshCustomerList();
}

async function recordDelivery(){
  const kg = parseFloat(document.getElementById('kg-input').value);
  if(!kg || kg <= 0){ alert("Enter a weight in kg greater than 0."); return; }
  const date = document.getElementById('date-input').value || todayStr();
  const party = document.getElementById('party-input').value.trim();
  const address = document.getElementById('address-input').value.trim();
  const description = document.getElementById('desc-input').value.trim();
  const deposit = parseFloat(document.getElementById('deposit-input').value) || 0;
  const rate = settings.rate;
  const amount = kg * rate;
  const invoiceNo = nextInvoiceNo(date);
  const entry = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), date, kg, rate, amount, deposit, invoiceNo, party, address, description };
  deliveries.push(entry);
  await saveDeliveries();
  await upsertCustomer(party, address);
  renderSlip(entry);
  buildLedger();
}

function getYears(){
  const ys = new Set(deliveries.map(d => parseInt(d.date.slice(0,4))));
  ys.add(new Date().getFullYear());
  return Array.from(ys).sort((a,b)=>b-a);
}

function buildLedger(){
  const yearSelect = document.getElementById('year-select');

function renderYearGrid(){
  const yearDeliveries = deliveries.filter(d => parseInt(d.date.slice(0,4)) === currentYear);
  const totalKg = yearDeliveries.reduce((s,d)=>s+d.kg,0);
  const totalAmt = yearDeliveries.reduce((s,d)=>s+d.amount,0);

    `<span>Deliveries: <b>${yearDeliveries.length}</b></span>
     <span>Total kg: <b>${fmtKg(totalKg)}</b></span>
     <span>Total billed: <b>${fmtMoneyC(totalAmt)}</b></span>`;

}

function monthKey(year, monthIndex){
  return year + '-' + String(monthIndex + 1).padStart(2, '0');
}

/* Returns the payment status for one unit in one month:
   paid (met or exceeded expected), partial (some but not all),
   or unpaid (nothing received). With no expected rent set, any
   payment counts as paid and an empty month is simply blank. */
function rentStatus(unit, year, monthIndex){
  const key = monthKey(year, monthIndex);
  const entries = condoRent.filter(r => r.unit === unit && r.month === key);
  const received = entries.reduce((s,r) => s + (r.amount||0), 0);
  const expected = parseFloat(condoExpectedRent[unit]) || 0;
  if(received <= 0) return { status:'unpaid', received:0, expected, entries };
  if(expected > 0 && received + 0.001 < expected) return { status:'partial', received, expected, entries };
  return { status:'paid', received, expected, entries };
}

function pillHtml(status){
  if(status === 'paid')    return '<span class="pill pill-paid">Paid</span>';
  if(status === 'partial') return '<span class="pill pill-partial">Partial</span>';
  return '<span class="pill pill-unpaid">Unpaid</span>';
}

function buildCondoView(){
  const sel = document.getElementById('condo-year-select');
  const ys = new Set();
  condoRent.forEach(r => ys.add(parseInt(r.month.slice(0,4))));
  condoExpenses.forEach(e => ys.add(parseInt(e.date.slice(0,4))));
  ys.add(new Date().getFullYear());
  const years = Array.from(ys).sort((a,b)=>b-a);
  sel.innerHTML = years.map(y => `<option value="${y}" ${y===condoCurrentYear?'selected':''}>${y}</option>`).join('');
  renderCondoUnits();
}

function renderCondoUnits(){
  const y = condoCurrentYear;
  const now = new Date();
  const lastMonth = (y < now.getFullYear()) ? 11 : now.getMonth();

  let grandRent = 0, grandExp = 0, grandUnpaid = 0;

  const wrap = document.getElementById('condo-units-wrap');
  wrap.innerHTML = condoUnits.map(unit => {
    const yearRent = condoRent.filter(r => r.unit === unit && parseInt(r.month.slice(0,4)) === y);
    const yearExp  = condoExpenses.filter(e => e.unit === unit && parseInt(e.date.slice(0,4)) === y);
    const totalRent = yearRent.reduce((s,r)=>s+(r.amount||0),0);
    const totalExp  = yearExp.reduce((s,e)=>s+(e.amount||0),0);
    const net = totalRent - totalExp;

    // Count unpaid months up to the current month only (future months
    // aren't overdue yet, so flagging them would be noise).
    let unpaidCount = 0;
    const rentRows = [];
    for(let m = 0; m <= lastMonth; m++){
      const st = rentStatus(unit, y, m);
      if(st.status !== 'paid') unpaidCount++;
      rentRows.push(`
        <tr>
          <td style="white-space:nowrap;padding:8px 10px;">${MONTHS[m].slice(0,3)}</td>
          <td class="mono" style="white-space:nowrap;text-align:right;padding:8px 10px;">${st.received ? fmtMoneyC(st.received) : '—'}</td>
          <td style="white-space:nowrap;text-align:center;padding:8px 8px;">${pillHtml(st.status)}</td>
          <td style="white-space:nowrap;text-align:right;padding:8px 10px;">
            <button class="rm-btn condo-rent-add" data-unit="${escapeHtml(unit)}" data-month="${m}" style="font-size:12.5px;">${st.received ? 'Edit' : 'Add'}</button>
          </td>
        </tr>
      `);
    }

    const expRows = yearExp.length === 0
      ? `<tr><td colspan="4" style="color:#8a8b83;">No expenses recorded</td></tr>`
      : yearExp.sort((a,b)=>a.date.localeCompare(b.date)).map(e => `
          <tr>
            <td style="white-space:nowrap;">${e.date}</td>
            <td style="max-width:150px;"><div class="cell-trunc" style="max-width:150px;">${escapeHtml(e.category)}</div></td>
            <td class="mono" style="white-space:nowrap;text-align:right;">${fmtMoneyC(e.amount)}</td>
            <td style="white-space:nowrap;text-align:right;">
              <button class="rm-btn condo-exp-edit" data-id="${e.id}">Edit</button>
              <button class="rm-btn condo-exp-remove" data-id="${e.id}" style="margin-left:8px;">Remove</button>
            </td>
          </tr>
        `).join('');

    grandRent += totalRent; grandExp += totalExp; grandUnpaid += unpaidCount;

    return `
      <div class="condo-unit">
        <div class="condo-unit-head">
          <div>
            <div class="condo-unit-name">${escapeHtml(unit)}</div>
            ${condoTenants[unit] ? `<div style="font-size:12.5px;color:#66665f;margin-top:2px;">Tenant: ${escapeHtml(condoTenants[unit])}</div>` : `<div style="font-size:12.5px;color:#a8a99f;margin-top:2px;font-style:italic;">No tenant on file</div>`}
          </div>
          <div class="condo-unit-stats">
            <span>Rent collected<b>${fmtMoneyC(totalRent)}</b></span>
            <span>Expenses<b>${fmtMoneyC(totalExp)}</b></span>
            <span>Net<b style="color:${net>=0?'var(--forest)':'var(--rust)'}">${fmtMoneyC(net)}</b></span>
            ${unpaidCount > 0 ? `<span>Months outstanding<b style="color:var(--rust)">${unpaidCount}</b></span>` : ''}
          </div>
        </div>

        <div class="condo-sub-head">
          <div class="condo-sub-title">Rent received</div>
        </div>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
          <table class="daybook" style="min-width:0;">
            <thead><tr>
              <th style="white-space:nowrap;padding:8px 10px;">Month</th>
              <th class="mono" style="white-space:nowrap;text-align:right;padding:8px 10px;">Received</th>
              <th style="white-space:nowrap;text-align:center;padding:8px 8px;">Status</th>
              <th style="padding:8px 10px;"></th>
            </tr></thead>
            <tbody>${rentRows.join('')}</tbody>
          </table>
        </div>
        <div style="font-size:11px;color:#a8a99f;margin-top:4px;">Swipe left/right if a row runs off screen</div>

        <div class="condo-sub-head">
          <div class="condo-sub-title">Expenses</div>
          <button class="btn-sm condo-exp-add" data-unit="${escapeHtml(unit)}">+ Add expense</button>
        </div>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
          <table class="daybook" style="min-width:360px;">
            <thead><tr>
              <th style="white-space:nowrap;">Date</th>
              <th>Category</th>
              <th class="mono" style="white-space:nowrap;text-align:right;">Amount</th>
              <th></th>
            </tr></thead>
            <tbody>${expRows}</tbody>
          </table>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('condo-year-totals').innerHTML =
    `<span>Total rent: <b>${fmtMoneyC(grandRent)}</b></span>
     <span>Total expenses: <b>${fmtMoneyC(grandExp)}</b></span>
     <span>Net: <b>${fmtMoneyC(grandRent - grandExp)}</b></span>
     ${grandUnpaid > 0 ? `<span>Outstanding months: <b style="color:var(--rust)">${grandUnpaid}</b></span>` : ''}
     <button class="btn-sm" id="condo-settings-btn" style="margin-left:4px;">Manage units</button>`;

  attachCondoHandlers();
}

function attachCondoHandlers(){
  document.querySelectorAll('.condo-rent-add').forEach(btn => {
    btn.addEventListener('click', () => {
      openCondoRentModal(btn.getAttribute('data-unit'), parseInt(btn.getAttribute('data-month')));
    });
  });
  document.querySelectorAll('.condo-exp-add').forEach(btn => {
    btn.addEventListener('click', () => openCondoExpModal(btn.getAttribute('data-unit')));
  });
  document.querySelectorAll('.condo-exp-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const e = condoExpenses.find(x => x.id === btn.getAttribute('data-id'));
      if(e) openCondoExpModal(e.unit, e);
    });
  });
  document.querySelectorAll('.condo-exp-remove').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Remove this expense?')) return;
      condoExpenses = condoExpenses.filter(x => x.id !== btn.getAttribute('data-id'));
      await saveCondoExpenses();
      renderCondoUnits();
    });
  });
  const setBtn = document.getElementById('condo-settings-btn');
  if(setBtn) setBtn.addEventListener('click', openCondoSettings);
}

function openCondoRentModal(unit, monthIndex){
  condoModalUnit = unit;
  const key = monthKey(condoCurrentYear, monthIndex);
  const existing = condoRent.find(r => r.unit === unit && r.month === key);
  editingCondoRentId = existing ? existing.id : null;

  document.getElementById('condo-rent-modal-title').textContent = existing ? 'Edit Rent Record' : 'Record Rent';
  document.getElementById('condo-rent-unit').value = unit;
  const sel = document.getElementById('condo-rent-month');
  sel.innerHTML = MONTHS.map((m,i) =>
    `<option value="${i}" ${i===monthIndex?'selected':''}>${m} ${condoCurrentYear}</option>`).join('');
  document.getElementById('condo-rent-amount').value = existing ? existing.amount : (condoExpectedRent[unit] || '');
  document.getElementById('condo-rent-date').value = existing ? (existing.dateReceived || '') : todayStr();
  document.getElementById('condo-rent-notes').value = existing ? (existing.notes || '') : '';
  document.getElementById('condo-rent-modal').classList.add('show');
}
function closeCondoRentModal(){
  document.getElementById('condo-rent-modal').classList.remove('show');
  editingCondoRentId = null; condoModalUnit = null;
}

function openCondoExpModal(unit, existing){
  condoModalUnit = unit;
  editingCondoExpId = existing ? existing.id : null;
  document.getElementById('condo-exp-modal-title').textContent = existing ? 'Edit Expense' : 'Add Expense';
  document.getElementById('condo-exp-unit').value = unit;
  document.getElementById('condo-exp-category').value = existing ? existing.category : 'Management Fee';
  document.getElementById('condo-exp-amount').value = existing ? existing.amount : '';
  document.getElementById('condo-exp-date').value = existing ? existing.date : todayStr();
  document.getElementById('condo-exp-notes').value = existing ? (existing.notes || '') : '';
  document.getElementById('condo-exp-modal').classList.add('show');
}
function closeCondoExpModal(){
  document.getElementById('condo-exp-modal').classList.remove('show');
  editingCondoExpId = null; condoModalUnit = null;
}

/* The unit manager lets units be renamed, removed, or added. Each row
   keeps the unit's ORIGINAL name in data-original so that on save we
   can migrate existing rent/expense records to the new name — without
   that, renaming a unit would orphan all of its history. */
function condoUnitRowHtml(unit, expected, tenant){
  return `
    <div class="condo-unit-edit" style="border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px;">
      <div class="field-row" style="margin-bottom:0;">
        <div class="field">
          <label>Unit name</label>
          <input type="text" class="condo-unit-name-inp" data-original="${escapeHtml(unit)}" value="${escapeHtml(unit)}" placeholder="e.g. C-12-04">
        </div>
        <div class="field">
          <label>Expected rent / month</label>
          <input type="number" class="condo-expected-inp" step="0.01" min="0" value="${expected || ''}" placeholder="0.00">
        </div>
      </div>
      <div class="field" style="margin-top:12px;margin-bottom:0;">
        <label>Tenant name (optional)</label>
        <input type="text" class="condo-tenant-inp" value="${escapeHtml(tenant || '')}" placeholder="e.g. Ahmad Faiz">
      </div>
      <button class="rm-btn condo-remove-unit" style="margin-top:10px;">Remove this unit</button>
    </div>
  `;
}

function openCondoSettings(){
  document.getElementById('condo-settings-body').innerHTML =
    condoUnits.map(u => condoUnitRowHtml(u, condoExpectedRent[u], condoTenants[u])).join('');
  attachCondoSettingsHandlers();
  document.getElementById('condo-settings-modal').classList.add('show');
}

function attachCondoSettingsHandlers(){
  document.querySelectorAll('.condo-remove-unit').forEach(btn => {
    btn.onclick = () => {
      const row = btn.closest('.condo-unit-edit');
      const name = row.querySelector('.condo-unit-name-inp').getAttribute('data-original');
      const rentCount = condoRent.filter(r => r.unit === name).length;
      const expCount  = condoExpenses.filter(e => e.unit === name).length;
      const records = rentCount + expCount;
      if(records > 0){
        if(!confirm(`"${name}" has ${records} saved record${records===1?'':'s'} (rent and expenses). Removing the unit will delete them permanently. Continue?`)) return;
      }
      row.remove();
    };
  });
}

function closeCondoSettings(){ document.getElementById('condo-settings-modal').classList.remove('show'); }

/* ---------- NAV ---------- */
function showView(id){
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('tab-weigh').classList.toggle('active', id === 'view-weigh');
  document.getElementById('tab-ledger').classList.toggle('active', id === 'view-ledger');
  document.getElementById('tab-supplier').classList.toggle('active', id === 'view-supplier');
  document.getElementById('tab-condo').classList.toggle('active', id === 'view-condo');
}

/* ---------- SETTINGS MODAL ---------- */
function openSettings(){
  document.getElementById('set-company').value = settings.company;
  document.getElementById('set-regno').value = settings.regNo;
  document.getElementById('set-address').value = settings.address;
  document.getElementById('set-currency').value = settings.currency;
  document.getElementById('set-rate').value = settings.rate;
  document.getElementById('set-prefix').value = settings.invoicePrefix;
  document.getElementById('set-desc').value = settings.description;
  document.getElementById('set-bank').value = settings.bankName;
  document.getElementById('set-bankacc').value = settings.bankAcc;
  document.getElementById('set-sheeturl').value = settings.googleSheetUrl || '';
  document.getElementById('settings-modal').classList.add('show');
}
function closeSettings(){ document.getElementById('settings-modal').classList.remove('show'); }

let passwordModalCallback = null;

function askPassword(correctPassword, onSuccess, title){
  passwordModalCallback = { correctPassword, onSuccess };
  document.getElementById('password-modal-title').textContent = title || 'Enter Password';
  document.getElementById('password-modal-input').value = '';
  document.getElementById('password-modal-error').style.display = 'none';
  document.getElementById('password-modal').classList.add('show');
  document.getElementById('password-modal-input').focus();
}
function closePasswordModal(){
  document.getElementById('password-modal').classList.remove('show');
  passwordModalCallback = null;
}
function submitPasswordModal(){
  if(!passwordModalCallback) return;
  const entered = document.getElementById('password-modal-input').value;
  if(entered === passwordModalCallback.correctPassword){
    const cb = passwordModalCallback.onSuccess;
    closePasswordModal();
    cb();
  }else{
    document.getElementById('password-modal-error').style.display = 'block';
  }
}

function openSettingsGated(){
  askPassword(SETTINGS_PASSWORD, openSettings, 'Enter password to open Settings');
}

/* ---------- INIT ---------- */
async function init(){
  await loadData();
  document.getElementById('date-input').value = todayStr();
  document.getElementById('desc-input').value = settings.description;
  refreshRateUI();
  refreshCustomerList();
  buildLedger();

  document.getElementById('tab-weigh').addEventListener('click', () => showView('view-weigh'));
  document.getElementById('tab-ledger').addEventListener('click', () => {
    document.getElementById('ledger-year-view').style.display = 'block';
    document.getElementById('ledger-month-view').style.display = 'none';
    showView('view-ledger');
  });

  document.getElementById('tab-supplier').addEventListener('click', () => {
    document.getElementById('supplier-year-view').style.display = 'block';
    document.getElementById('supplier-month-view').style.display = 'none';
    document.getElementById('supplier-search-input').value = '';
    renderSupplierSearchResults('');
    buildSupplierView();
    showView('view-supplier');
  });

  document.getElementById('supplier-search-input').addEventListener('input', (e) => {
    renderSupplierSearchResults(e.target.value);
  });

  document.getElementById('supplier-year-select').addEventListener('change', (e) => {
    supplierCurrentYear = parseInt(e.target.value);
    renderSupplierYearGrid();
  });
  document.getElementById('supplier-back-to-year').addEventListener('click', () => {
    document.getElementById('supplier-year-view').style.display = 'block';
    document.getElementById('supplier-month-view').style.display = 'none';
  });

  document.getElementById('add-supplier-btn').addEventListener('click', () => openSupplierModal());
  document.getElementById('supplier-cancel').addEventListener('click', closeSupplierModal);

  document.getElementById('supplier-save').addEventListener('click', async () => {
    const company = document.getElementById('sup-company').value.trim();
    const invoiceNo = document.getElementById('sup-invoiceno').value.trim();
    const purchaseDate = document.getElementById('sup-purchasedate').value;
    const paymentDate = document.getElementById('sup-paymentdate').value;
    const amount = parseFloat(document.getElementById('sup-amount').value) || 0;
    const notes = document.getElementById('sup-notes').value.trim();
    if(!company){ alert('Enter a supplier / company name.'); return; }
    if(!paymentDate){ alert('Enter a payment date.'); return; }
    if(!amount || amount <= 0){ alert('Enter an amount greater than 0.'); return; }

    if(editingSupplierId){
      const existing = supplierPayments.find(p => p.id === editingSupplierId);
      if(existing){
        existing.company = company;
        existing.invoiceNo = invoiceNo || '—';
        existing.purchaseDate = purchaseDate;
        existing.paymentDate = paymentDate;
        existing.amount = amount;
        existing.notes = notes || '';
      }
    }else{
      supplierPayments.push({
        id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
        company, invoiceNo: invoiceNo || '—', purchaseDate, paymentDate, amount,
        notes: notes || ''
      });
    }
    await saveSupplierPayments();
    closeSupplierModal();
    buildSupplierView();
    renderSupplierSearchResults(document.getElementById('supplier-search-input').value);
  });

  document.getElementById('tab-sheet').addEventListener('click', () => {
    if(!settings.googleSheetUrl){
      alert('No Google Sheet link has been added yet. Open Settings (gear icon) and paste your Google Sheet link first.');
      openSettingsGated();
      return;
    }
    window.open(settings.googleSheetUrl, '_blank');
  });

  document.getElementById('kg-input').addEventListener('input', updateAmount);
  document.getElementById('record-btn').addEventListener('click', recordDelivery);
  document.getElementById('new-entry-btn').addEventListener('click', resetEntryForm);
  const originalTitle = document.title;
  document.getElementById('print-btn').addEventListener('click', () => {
    if(lastEntry){
      const safeName = (lastEntry.party || 'Invoice').replace(/[\\/:*?"<>|]/g, '').trim();
      document.title = `${safeName} - ${lastEntry.invoiceNo}`;
  }
  window.print();
});
window.addEventListener('afterprint', () => { document.title = originalTitle; });
  document.getElementById('change-rate-link').addEventListener('click', openSettingsGated);

  const partyInput = document.getElementById('party-input');
  partyInput.addEventListener('input', () => {
    const match = customers.find(c => c.name.toLowerCase() === partyInput.value.trim().toLowerCase());
    if(match){ document.getElementById('address-input').value = match.address || ''; }
  });

  document.getElementById('settings-btn').addEventListener('click', openSettingsGated);

  /* Condo Rental tab */
  document.getElementById('tab-condo').addEventListener('click', () => {
    buildCondoView();
    showView('view-condo');
  });
  document.getElementById('condo-year-select').addEventListener('change', (e) => {
    condoCurrentYear = parseInt(e.target.value);
    renderCondoUnits();
  });

  document.getElementById('condo-rent-cancel').addEventListener('click', closeCondoRentModal);
  document.getElementById('condo-rent-save').addEventListener('click', async () => {
    const unit = document.getElementById('condo-rent-unit').value;
    const monthIndex = parseInt(document.getElementById('condo-rent-month').value);
    const amount = parseFloat(document.getElementById('condo-rent-amount').value) || 0;
    const dateReceived = document.getElementById('condo-rent-date').value;
    const notes = document.getElementById('condo-rent-notes').value.trim();
    if(!amount || amount <= 0){ alert('Enter an amount greater than 0.'); return; }
    const key = monthKey(condoCurrentYear, monthIndex);

    if(editingCondoRentId){
      const ex = condoRent.find(r => r.id === editingCondoRentId);
      if(ex){ ex.unit = unit; ex.month = key; ex.amount = amount; ex.dateReceived = dateReceived; ex.notes = notes; }
    }else{
      condoRent.push({
        id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
        unit, month: key, amount, dateReceived, notes
      });
    }
    await saveCondoRent();
    closeCondoRentModal();
    buildCondoView();
  });

  document.getElementById('condo-exp-cancel').addEventListener('click', closeCondoExpModal);
  document.getElementById('condo-exp-save').addEventListener('click', async () => {
    const unit = document.getElementById('condo-exp-unit').value;
    const category = document.getElementById('condo-exp-category').value;
    const amount = parseFloat(document.getElementById('condo-exp-amount').value) || 0;
    const date = document.getElementById('condo-exp-date').value;
    const notes = document.getElementById('condo-exp-notes').value.trim();
    if(!amount || amount <= 0){ alert('Enter an amount greater than 0.'); return; }
    if(!date){ alert('Enter a date.'); return; }

    if(editingCondoExpId){
      const ex = condoExpenses.find(x => x.id === editingCondoExpId);
      if(ex){ ex.unit = unit; ex.category = category; ex.amount = amount; ex.date = date; ex.notes = notes; }
    }else{
      condoExpenses.push({
        id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
        unit, category, amount, date, notes
      });
    }
    await saveCondoExpenses();
    closeCondoExpModal();
    buildCondoView();
  });

  document.getElementById('condo-settings-cancel').addEventListener('click', closeCondoSettings);
  document.getElementById('condo-add-unit-btn').addEventListener('click', () => {
    document.getElementById('condo-settings-body').insertAdjacentHTML('beforeend', condoUnitRowHtml('', '', ''));
    attachCondoSettingsHandlers();
  });
  document.getElementById('condo-settings-save').addEventListener('click', async () => {
    const rows = Array.from(document.querySelectorAll('.condo-unit-edit'));
    const newUnits = [];
    const newExpected = {};
    const newTenants = {};
    const renames = []; // {from, to} — applied to existing records below

    for(const row of rows){
      const nameInp = row.querySelector('.condo-unit-name-inp');
      const name = nameInp.value.trim();
      const original = nameInp.getAttribute('data-original');
      if(!name) continue; // blank rows are just skipped
      if(newUnits.includes(name)){
        alert(`Duplicate unit name: "${name}". Each unit needs a unique name.`);
        return;
      }
      newUnits.push(name);
      const amt = parseFloat(row.querySelector('.condo-expected-inp').value) || 0;
      if(amt > 0) newExpected[name] = amt;
      const tenant = row.querySelector('.condo-tenant-inp').value.trim();
      if(tenant) newTenants[name] = tenant;
      if(original && original !== name) renames.push({ from: original, to: name });
    }

    if(newUnits.length === 0){ alert('Keep at least one unit.'); return; }

    // Carry existing rent and expense records over to renamed units.
    renames.forEach(({from, to}) => {
      condoRent.forEach(r => { if(r.unit === from) r.unit = to; });
      condoExpenses.forEach(e => { if(e.unit === from) e.unit = to; });
    });

    // Drop records belonging to units that were removed entirely.
    const removed = condoUnits.filter(u => {
      const renamedTo = renames.find(r => r.from === u);
      const finalName = renamedTo ? renamedTo.to : u;
      return !newUnits.includes(finalName);
    });
    if(removed.length){
      condoRent = condoRent.filter(r => !removed.includes(r.unit));
      condoExpenses = condoExpenses.filter(e => !removed.includes(e.unit));
    }

    condoUnits = newUnits;
    condoExpectedRent = newExpected;
    condoTenants = newTenants;

    await saveCondoSettings();
    await saveCondoRent();
    await saveCondoExpenses();
    closeCondoSettings();
    buildCondoView();
  });

  /* Supplier detail popup */
  document.getElementById('supplier-detail-close').addEventListener('click', closeSupplierDetail);
  document.getElementById('supplier-detail-edit').addEventListener('click', () => {
    const entry = supplierPayments.find(p => p.id === supplierDetailId);
    closeSupplierDetail();
    if(entry) openSupplierModal(entry);
  });
  document.getElementById('supplier-detail-remove').addEventListener('click', async () => {
    if(!confirm('Remove this payment record?')) return;
    const onChanged = supplierDetailOnChanged;
    supplierPayments = supplierPayments.filter(p => p.id !== supplierDetailId);
    await saveSupplierPayments();
    closeSupplierDetail();
    if(onChanged) onChanged();
    renderSupplierYearGrid();
  });

  document.getElementById('note-modal-close').addEventListener('click', closeNoteModal);
  document.getElementById('password-modal-cancel').addEventListener('click', closePasswordModal);
  document.getElementById('password-modal-submit').addEventListener('click', submitPasswordModal);
  document.getElementById('password-modal-input').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') submitPasswordModal();
  });
  document.getElementById('settings-cancel').addEventListener('click', closeSettings);
  document.getElementById('settings-save').addEventListener('click', async () => {
    settings.company = document.getElementById('set-company').value.trim() || 'My Business';
    settings.regNo = document.getElementById('set-regno').value.trim();
    settings.address = document.getElementById('set-address').value.trim();
    settings.currency = document.getElementById('set-currency').value.trim() || 'RM';
    settings.rate = parseFloat(document.getElementById('set-rate').value) || 0;
    settings.invoicePrefix = document.getElementById('set-prefix').value.trim() || 'PR';
    settings.description = document.getElementById('set-desc').value.trim() || 'Sale of Prawns';
    settings.bankName = document.getElementById('set-bank').value.trim();
    settings.bankAcc = document.getElementById('set-bankacc').value.trim();
    settings.googleSheetUrl = document.getElementById('set-sheeturl').value.trim();
    await saveSettings();
    refreshRateUI();
    if(!document.getElementById('desc-input').value){ document.getElementById('desc-input').value = settings.description; }
    closeSettings();
  });

  document.getElementById('year-select').addEventListener('change', (e) => {
    currentYear = parseInt(e.target.value);
    renderYearGrid();
  });
  document.getElementById('back-to-year').addEventListener('click', () => {
    document.getElementById('ledger-year-view').style.display = 'block';
    document.getElementById('ledger-month-view').style.display = 'none';
  });

}
init();
</script>
</body>
</html>
